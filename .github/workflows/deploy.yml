name: Deploy U-map to Kubernetes

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: umap-backend
  FRONTEND_IMAGE: umap-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.BACKEND_IMAGE }}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.FRONTEND_IMAGE }}
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://your-domain.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      
      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
      
      - name: Update Kubernetes secrets
        run: |
          kubectl create secret generic umap-secrets \
            --from-literal=app-key="${{ secrets.APP_KEY }}" \
            --from-literal=db-database="${{ secrets.DB_DATABASE }}" \
            --from-literal=db-username="${{ secrets.DB_USERNAME }}" \
            --from-literal=db-password="${{ secrets.DB_PASSWORD }}" \
            --from-literal=groq-api-key="${{ secrets.GROQ_API_KEY }}" \
            --from-literal=gemini-api-key="${{ secrets.GEMINI_API_KEY }}" \
            --namespace=umap --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Update ConfigMap
        run: |
          kubectl apply -f k8s/configmap.yaml
      
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/worker-deployment.yaml
          kubectl apply -f k8s/scheduler-deployment.yaml
          kubectl apply -f k8s/services.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml
      
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/umap-backend -n umap --timeout=5m
          kubectl rollout status deployment/umap-frontend -n umap --timeout=5m
          kubectl rollout status deployment/umap-worker -n umap --timeout=5m
          kubectl rollout status deployment/umap-scheduler -n umap --timeout=5m
      
      - name: Verify deployment
        run: |
          kubectl get pods -n umap
          kubectl get services -n umap
          kubectl get ingress -n umap
