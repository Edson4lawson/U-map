services:
  # Backend Laravel API — Docker (PHP + Apache)
  - type: web
    name: umap-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: APP_NAME
        value: U-Map
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://umap-backend.onrender.com
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: fr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: ALLOWED_ORIGINS
        value: https://umap-ten.vercel.app,https://u-map.vercel.app
      - key: MAIL_MAILER
        value: log
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
