apiVersion: apps/v1
kind: Deployment
metadata:
  name: umap-scheduler
  namespace: umap
  labels:
    app: umap-scheduler
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: umap-scheduler
  template:
    metadata:
      labels:
        app: umap-scheduler
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: scheduler
        image: umap-backend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
        command: ["/bin/sh", "-c"]
        args:
          - |
            while true; do
              php artisan schedule:work --verbose --no-interaction &
              sleep 60
            done
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_DEBUG
          value: "false"
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: umap-secrets
              key: app-key
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: umap-config
              key: db-host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: umap-config
              key: db-port
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: umap-secrets
              key: db-database
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: umap-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: umap-secrets
              key: db-password
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: umap-config
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: umap-config
              key: redis-port
        - name: CACHE_DRIVER
          value: "redis"
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: / ar/www/html/bo tstrap/cache
      vo- name: QUEUE_CONNECTION
          value: "redis"
        - name: SESSION_DRIVER
          value: "redis"e
      - nam: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: storage
          mountPath: /var/www/html/storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: umap-backend-storage
      restartPolicy: Always
