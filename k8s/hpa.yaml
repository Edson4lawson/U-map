---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: umap-worker-hpa
  namespace: umap
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: umap-worker
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Percent
        value: 30
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
