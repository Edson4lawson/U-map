apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: umap-secret-store
  namespace: umap
spec:
  # Use AWS Secrets Manager
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # Replace with your region
      auth:
        jwt:
          serviceAccountRef:
            name: umap-external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: umapp-app-key
  namespace: umap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: umap-secret-store
    kind: SecretStore
  target:
    name: umap-app-key
    creationPolicy: Owner
  data:
  - secretKey: app-key
    remoteRef:
      key: umap/app-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: umap-db-credentials
  namespace: umap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: umap-secret-store
    kind: SecretStore
  target:
    name: umap-db-credentials
    creationPolicy: Owner
  data:
  - secretKey: db-database
    remoteRef:
      key: umap/db-database
  - secretKey: db-username
    remoteRef:
      key: umap/db-username
  - secretKey: db-password
    remoteRef:
      key: umap/db-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: umap-api-keys
  namespace: umap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: umap-secret-store
    kind: SecretStore
  target:
    name: umap-api-keys
    creationPolicy: Owner
  data:
  - secretKey: groq-api-key
    remoteRef:
      key: umap/groq-api-key
  - secretKey: gemini-api-key
    remoteRef:
      key: umap/gemini-api-key
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: umap-external-secrets-sa
  namespace: umap
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/umap-external-secrets-role
---
